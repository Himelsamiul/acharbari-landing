    <ellipse cx="248" cy="288" rx="26" ry="15" fill="#a8612b"/>
    <!-- tamarind seeds -->
    <ellipse cx="204" cy="212" rx="8" ry="12" fill="#5c3410" transform="rotate(18 204 212)"/>
    <ellipse cx="228" cy="258" rx="7" ry="11" fill="#5c3410" transform="rotate(-24 228 258)"/>
    <ellipse cx="188" cy="292" rx="6" ry="9" fill="#5c3410" transform="rotate(30 188 292)"/>
    <!-- glossy top -->
    <rect x="118" y="158" width="164" height="156" fill="url(#glass4)"/>
