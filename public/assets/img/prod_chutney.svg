  <rect x="118" y="158" width="164" height="156" rx="28" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="3"/>

  <rect x="148" y="212" width="104" height="56" rx="12" fill="#fffdf7" stroke="#b45309" stroke-width="3"/>
  <text x="200" y="237" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#7c2d12">CHUTNEY</text>
  <text x="200" y="256" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif" font-size="11" fill="#b45309">তেঁতুল ঝোল</text>

  <!-- tamarind pods accent -->
  <ellipse cx="318" cy="220" rx="26" ry="12" fill="#a8612b" transform="rotate(24 318 220)"/>
  <ellipse cx="332" cy="248" rx="22" ry="10" fill="#8a4a1c" transform="rotate(-18 332 248)"/>
  <ellipse cx="86" cy="180" rx="24" ry="11" fill="#a8612b" transform="rotate(-30 86 180)"/>
