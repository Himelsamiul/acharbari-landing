<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf3df"/>
      <stop offset="1" stop-color="#f7e0bd"/>
    </linearGradient>
    <linearGradient id="glass4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
    <clipPath id="jarClip4"><rect x="118" y="158" width="164" height="156" rx="28"/></clipPath>
  </defs>

  <rect width="400" height="400" rx="36" fill="url(#bg4)"/>
  <circle cx="76" cy="78" r="22" fill="#b45309" opacity=".16"/>
  <circle cx="336" cy="94" r="13" fill="#ca8a04" opacity=".2"/>
  <circle cx="330" cy="316" r="26" fill="#7c2d12" opacity=".12"/>

  <path d="M56 288 q28 -34 62 -28 q-8 38 -62 28z" fill="#84a04c" opacity=".65"/>

  <ellipse cx="200" cy="328" rx="110" ry="16" fill="#7c2d12" opacity=".14"/>

  <!-- jar -->
  <rect x="132" y="136" width="136" height="24" rx="8" fill="#5f3a20"/>
  <rect x="138" y="120" width="124" height="18" rx="7" fill="#7c2d12"/>
  <rect x="118" y="158" width="164" height="156" rx="28" fill="#9a5a28"/>
  <g clip-path="url(#jarClip4)">
    <rect x="118" y="158" width="164" height="156" fill="#8a4a1c"/>
