<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e4"/>
      <stop offset="1" stop-color="#fde7c3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".15"/>
    </linearGradient>
    <clipPath id="jarClip">
      <rect x="112" y="150" width="176" height="168" rx="30"/>
    </clipPath>
  </defs>

  <rect width="400" height="400" rx="36" fill="url(#bg)"/>
  <circle cx="70" cy="72" r="26" fill="#fbbf24" opacity=".22"/>
  <circle cx="338" cy="98" r="14" fill="#ea580c" opacity=".18"/>
  <circle cx="318" cy="322" r="30" fill="#d97706" opacity=".14"/>

  <!-- leaf accents -->
  <path d="M52 300 q26 -34 62 -30 q-8 40 -62 30z" fill="#84a04c" opacity=".75"/>
  <path d="M348 236 q-30 -26 -60 -14 q16 36 60 14z" fill="#a3b86a" opacity=".7"/>

  <!-- ground shadow -->
  <ellipse cx="200" cy="330" rx="112" ry="17" fill="#7c2d12" opacity=".14"/>

  <!-- jar -->
  <rect x="126" y="128" width="148" height="26" rx="9" fill="#5f3a20"/>
  <rect x="132" y="112" width="136" height="20" rx="8" fill="#7c2d12"/>
  <rect x="112" y="148" width="176" height="170" rx="30" fill="#f4a340"/>
  <g clip-path="url(#jarClip)">
    <rect x="112" y="148" width="176" height="170" fill="#e8890c"/>
    <!-- mango chunks -->
    <circle cx="150" cy="192" r="22" fill="#fbbf24"/>
    <circle cx="212" cy="178" r="18" fill="#fcd34d"/>
    <circle cx="262" cy="204" r="21" fill="#f59e0b"/>
    <circle cx="160" cy="258" r="20" fill="#fcd34d"/>
    <circle cx="228" cy="262" r="24" fill="#fbbf24"/>
    <circle cx="188" cy="222" r="16" fill="#fde68a"/>
    <circle cx="266" cy="286" r="16" fill="#f59e0b"/>
    <circle cx="140" cy="300" r="15" fill="#fbbf24"/>
    <circle cx="212" cy="306" r="18" fill="#fcd34d"/>
    <!-- mustard seeds specks -->
    <circle cx="176" cy="188" r="3.4" fill="#7c2d12" opacity=".5"/>
    <circle cx="244" cy="240" r="3.4" fill="#7c2d12" opacity=".5"/>
    <circle cx="158" cy="228" r="3" fill="#7c2d12" opacity=".45"/>
    <circle cx="238" cy="292" r="3" fill="#7c2d12" opacity=".45"/>
    <!-- glass sheen -->
    <rect x="112" y="148" width="176" height="170" fill="url(#glass)"/>
    <rect x="128" y="162" width="16" height="140" rx="8" fill="#fff" opacity=".38"/>
  </g>
  <rect x="112" y="148" width="176" height="170" rx="30" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="3"/>

  <!-- label -->
  <rect x="142" y="204" width="116" height="58" rx="12" fill="#fffdf7" stroke="#d97706" stroke-width="3"/>
  <text x="200" y="230" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#7c2d12">MANGO</text>
  <text x="200" y="249" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif" font-size="11" fill="#b45309">খাঁটি আচার</text>

  <!-- cloth cover -->
  <path d="M124 116 q10 -26 76 -26 q66 0 76 26 q-24 14 -76 14 q-52 0 -76 -14z" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <path d="M124 116 l152 0 M148 104 l4 26 M200 90 l0 40 M252 104 l-4 26" stroke="#e7a94f" stroke-width="2" fill="none"/>
  <ellipse cx="200" cy="131" rx="84" ry="9" fill="none" stroke="#b45309" stroke-width="5"/>
</svg>
