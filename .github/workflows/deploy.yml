name: Deploy to Live (cPanel)

# main e push = live site e automatic deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {} # Actions tab theke manually o chalano jay

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP upload (changed files only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: public_html/
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/**
            **/storage/app/private/**
            **/public/storage
            .env
            .env.example
            .env.backup
            DEPLOYMENT.md
            README.md

      # deploy er por live DB te notun migration chalano hoy
      # (server e setup.php ache — APP_KEY chara keu chalate parbe na)
      - name: Run live migrations
        run: |
          sleep 15
          curl -fsS --max-time 90 "https://khorak.shop/setup.php?key=${{ secrets.SETUP_KEY }}" \
            && echo "== LIVE MIGRATIONS OK ==" \
            || echo "== migrate call failed — file deploy holo tobe migration pore chalate hobe =="
