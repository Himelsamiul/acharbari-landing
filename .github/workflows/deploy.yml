name: Deploy to Live (cPanel)

# main e push = SHUDHU KHORAK auto deploy. amrong + ayra = MANUAL (button only) —
# FTP boro vendor upload e file fele dey, tai working site accidental redeploy theke rokkha.
# amrong/ayra pathate: Actions tab → Deploy to Live (cPanel) → Run workflow → domain tick
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      khorak:
        description: 'khorak.shop e deploy'
        type: boolean
        default: false
      amrong:
        description: 'amrongbd.com e deploy'
        type: boolean
        default: false
      ayra:
        description: 'ayratraders.com e deploy'
        type: boolean
        default: false
      shabib:
        description: 'mshabibtraders.com e deploy'
        type: boolean
        default: false

jobs:
  # ---------------------------------------------------------------
  # KHORAK (AcharBari — khorak.shop): push e auto, button e o chalay
  # ---------------------------------------------------------------
  deploy-khorak:
    if: github.event_name == 'push' || inputs.khorak == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp deploy version
        run: git rev-parse --short HEAD > public/version.txt

      # vendor/ gitignored — tai runner e fresh composer install kore
      # vendor soho upload korte hoy, nahole notun package (jemon dompdf)
      # server e kokhono jabe na
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Install composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: FTP upload (full overwrite, never deletes)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          command -v lftp >/dev/null || sudo apt-get install -y -qq lftp
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' -e 's#^\(tests\|\.git\|\.github\)/$#rm -r -f /public_html/\1#;t' -e 's#^#rm -f /public_html/#' deploy/retired-files.txt > /tmp/retired.lftp
          lftp -u "$FTP_USER","$FTP_PASS" ftp://${{ secrets.FTP_SERVER }} << 'SCRIPT'
            set ftp:ssl-allow yes
            set ftp:ssl-protect-data yes
            # shared hosting er FTP cert hostname match kore na —
            # user-approved: encryption thake, shudhu identity check off
            set ssl:verify-certificate no
            set net:max-retries 3
            set net:timeout 30
            # a failed mirror must fail the job (else the rm lines below set the exit code)
            set cmd:fail-exit yes
            # main cPanel FTP account (khorak) chroot home = /home/khorak —
            # tai absolute /public_html e upload korlei exactly doc root e pore
            mirror -R --verbose --overwrite \
              --exclude-glob .git* \
              --exclude '^\.git/' \
              --exclude '^\.github/' \
              --exclude '^\.env' \
              --exclude '^node_modules/' \
              --exclude '^tests/' \
              --exclude '^DEPLOYMENT\.md$' \
              --exclude '^deploy/' \
              --exclude '^public/robots\.txt$' \
              . /public_html
            # files a release retired (mirror never deletes) — removed by name
            source /tmp/retired.lftp
            bye
          SCRIPT

      # deploy er por live DB te notun migration chalano hoy
      # (server e setup.php ache — APP_KEY chara keu chalate parbe na)
      # NOTE: root .htaccess root-level *.php block kore (403), tai /public/ path
      - name: Run live migrations
        run: |
          sleep 15
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 \
            "https://khorak.shop/public/setup.php?key=${{ secrets.SETUP_KEY }}" \
            || { echo "::error::Live migration FAILED — site will 500 if new columns are missing"; exit 1; }
          echo "== LIVE MIGRATIONS OK =="

  # ---------------------------------------------------------------
  # AMRONG (amrongbd.com): push e o auto deploy (3 domain ek sathe)
  # ---------------------------------------------------------------
  deploy-amrong:
    if: github.event_name == 'workflow_dispatch' && inputs.amrong == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp deploy version
        run: git rev-parse --short HEAD > public/version.txt

      # vendor/ gitignored — tai runner e fresh composer install kore
      # vendor soho upload korte hoy, nahole notun package (jemon dompdf)
      # server e kokhono jabe na
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Install composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: FTP upload (full overwrite, never deletes)
        env:
          FTP_USER: ${{ secrets.AMRONG_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.AMRONG_FTP_PASSWORD }}
        run: |
          command -v lftp >/dev/null || sudo apt-get install -y -qq lftp
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' -e 's#^\(tests\|\.git\|\.github\)/$#rm -r -f /public_html/\1#;t' -e 's#^#rm -f /public_html/#' deploy/retired-files.txt > /tmp/retired.lftp
          lftp -u "$FTP_USER","$FTP_PASS" ftp://amrongbd.com << 'SCRIPT'
            set ftp:ssl-allow yes
            set ftp:ssl-protect-data yes
            set ssl:verify-certificate no
            set net:max-retries 3
            set net:timeout 30
            # a failed mirror must fail the job (else the rm lines below set the exit code)
            set cmd:fail-exit yes
            # main cPanel FTP account (amrong) chroot home = /home/amrong —
            # /public_html e upload korlei doc root e pore
            mirror -R --verbose --overwrite \
              --exclude-glob .git* \
              --exclude '^\.git/' \
              --exclude '^\.github/' \
              --exclude '^\.env' \
              --exclude '^node_modules/' \
              --exclude '^tests/' \
              --exclude '^DEPLOYMENT\.md$' \
              --exclude '^deploy/' \
              --exclude '^public/robots\.txt$' \
              . /public_html
            # files a release retired (mirror never deletes) — removed by name
            source /tmp/retired.lftp
            bye
          SCRIPT

      - name: Run live migrations
        run: |
          sleep 15
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 \
            "https://amrongbd.com/public/setup.php?key=${{ secrets.AMRONG_SETUP_KEY }}" \
            || { echo "::error::Live migration FAILED — site will 500 if new columns are missing"; exit 1; }
          echo "== LIVE MIGRATIONS OK =="

  # ---------------------------------------------------------------
  # AYRA (ayratraders.com): push e o auto deploy (3 domain ek sathe)
  # ---------------------------------------------------------------
  deploy-ayra:
    if: github.event_name == 'workflow_dispatch' && inputs.ayra == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp deploy version
        run: git rev-parse --short HEAD > public/version.txt

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Install composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: FTP upload (full overwrite, never deletes)
        env:
          FTP_USER: ${{ secrets.AYRA_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.AYRA_FTP_PASSWORD }}
        run: |
          command -v lftp >/dev/null || sudo apt-get install -y -qq lftp
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' -e 's#^\(tests\|\.git\|\.github\)/$#rm -r -f /public_html/\1#;t' -e 's#^#rm -f /public_html/#' deploy/retired-files.txt > /tmp/retired.lftp
          lftp -u "$FTP_USER","$FTP_PASS" ftp://ayratraders.com << 'SCRIPT'
            set ftp:ssl-allow yes
            set ftp:ssl-protect-data yes
            set ssl:verify-certificate no
            set net:max-retries 3
            set net:timeout 30
            # a failed mirror must fail the job (else the rm lines below set the exit code)
            set cmd:fail-exit yes
            mirror -R --verbose --overwrite \
              --exclude-glob .git* \
              --exclude '^\.git/' \
              --exclude '^\.github/' \
              --exclude '^\.env' \
              --exclude '^node_modules/' \
              --exclude '^tests/' \
              --exclude '^DEPLOYMENT\.md$' \
              --exclude '^deploy/' \
              --exclude '^public/robots\.txt$' \
              . /public_html
            # files a release retired (mirror never deletes) — removed by name
            source /tmp/retired.lftp
            bye
          SCRIPT

      - name: Run live migrations (non-fatal — ayra first run may need manual migrate)
        run: |
          sleep 15
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 \
            "https://ayratraders.com/public/setup.php?key=${{ secrets.AYRA_SETUP_KEY }}" \
            && echo "== LIVE MIGRATIONS OK ==" \
            || echo "::warning::ayra migration skipped (setup.php missing?) — run 'php artisan migrate --force' once in cPanel Terminal (no --seed on a live store)"

  # ---------------------------------------------------------------
  # SHABIB (mshabibtraders.com): MANUAL only (button). Fresh/empty server —
  # vendor ke ekTA archive (vendor.tar.gz) hisebe pathai, karon FTP fresh
  # 8869-file vendor upload e file fele dey. Server-e ab-bootstrap.php
  # archive extract + migrate kore. Domain Cloudflare-proxied, tai
  # FTP host = ORIGIN IP (SHABIB_FTP_SERVER secret), domain name noy.
  # ---------------------------------------------------------------
  deploy-shabib:
    if: github.event_name == 'workflow_dispatch' && inputs.shabib == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp deploy version
        run: git rev-parse --short HEAD > public/version.txt

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Install composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Archive vendor (single-file transfer — FTP boro vendor fele dey)
        run: tar -czf vendor.tar.gz vendor

      # vendor/ dir mirror theke bad, kintu vendor.tar.gz (ekTA file) upload hoy.
      # ab-bootstrap.php (public/ e committed) server-e extract kore.
      - name: FTP upload (app without vendor/ dir, + vendor.tar.gz)
        env:
          FTP_USER: ${{ secrets.SHABIB_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.SHABIB_FTP_PASSWORD }}
        run: |
          command -v lftp >/dev/null || sudo apt-get install -y -qq lftp
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' -e 's#^\(tests\|\.git\|\.github\)/$#rm -r -f /public_html/\1#;t' -e 's#^#rm -f /public_html/#' deploy/retired-files.txt > /tmp/retired.lftp
          lftp -u "$FTP_USER","$FTP_PASS" ftp://${{ secrets.SHABIB_FTP_SERVER }} << 'SCRIPT'
            set ftp:ssl-allow yes
            set ftp:ssl-protect-data yes
            set ssl:verify-certificate no
            set net:max-retries 3
            set net:timeout 30
            # a failed mirror must fail the job (else the rm lines below set the exit code)
            set cmd:fail-exit yes
            mirror -R --verbose --overwrite \
              --exclude-glob .git* \
              --exclude '^\.git/' \
              --exclude '^\.github/' \
              --exclude '^\.env' \
              --exclude '^node_modules/' \
              --exclude '^tests/' \
              --exclude '^vendor/' \
              --exclude '^DEPLOYMENT\.md$' \
              --exclude '^deploy/' \
              --exclude '^public/robots\.txt$' \
              . /public_html
            # files a release retired (mirror never deletes) — removed by name
            source /tmp/retired.lftp
            bye
          SCRIPT

      # ekTA GET: extract (Cloudflare 524 dile-o server-e cholte thake), tarpor
      # migrate (vendor tokhon present). Non-fatal — proyojone browser e manually.
      # Routine deploy e seed NOI — live store er password/brand/product thik thake.
      - name: Server-side vendor extract + migrate (non-fatal)
        run: |
          sleep 10
          echo "-- extract vendor.tar.gz --"
          curl -fsS --max-time 240 --retry 1 --retry-delay 20 \
            "https://mshabibtraders.com/public/ab-bootstrap.php?key=${{ secrets.SHABIB_SETUP_KEY }}&extract=1" || true
          sleep 20
          echo "-- migrate --"
          curl -fsS --max-time 180 --retry 2 --retry-delay 15 \
            "https://mshabibtraders.com/public/ab-bootstrap.php?key=${{ secrets.SHABIB_SETUP_KEY }}" \
            && echo "== LIVE MIGRATIONS OK ==" \
            || echo "::warning::browser e /public/ab-bootstrap.php?key=... ekbar chalan"
