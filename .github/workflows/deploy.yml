name: Deploy to Live (cPanel)

# main e push = live site e automatic deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {} # Actions tab theke manually o chalano jay

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP upload (changed files only, never deletes)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          command -v lftp >/dev/null || sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASS" ftp://khorak.shop << 'SCRIPT'
            set ftp:ssl-allow yes
            set ftp:ssl-protect-data yes
            # shared hosting er FTP cert hostname match kore na —
            # user-approved: encryption thake, shudhu identity check off
            set ssl:verify-certificate no
            set net:max-retries 3
            set net:timeout 30
            debug 3
            pwd
            ls -la .
            mirror -R --verbose \
              --exclude-glob .git* \
              --exclude-glob .github \
              --exclude .env \
              --exclude .env.example \
              --exclude-glob node_modules \
              --exclude-glob tests \
              --exclude DEPLOYMENT.md \
              . ./
            bye
          SCRIPT

      # deploy er por live DB te notun migration chalano hoy
      # (server e setup.php ache — APP_KEY chara keu chalate parbe na)
      - name: Run live migrations
        run: |
          sleep 15
          curl -fsS --max-time 90 "https://khorak.shop/setup.php?key=${{ secrets.SETUP_KEY }}" \
            && echo "== LIVE MIGRATIONS OK ==" \
            || echo "== migrate call failed — file deploy holo tobe migration pore chalate hobe =="
